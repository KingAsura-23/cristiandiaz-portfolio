<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Cristian Diaz</title>
    <link rel="stylesheet" href="../assets/css/global.css">
</head>
<body class="neutral-page">

    <nav id="site-nav" class="site-nav" data-root="../" data-page="contact"></nav>

    <header class="page-header container reveal">
        <h1>Contact</h1>
        <p>Get in touch — I'd love to connect.</p>
    </header>

    <section class="section">
        <div class="container">
            <div class="contact-grid">
                <a href="mailto:your.email@example.com" class="contact-link reveal" data-delay="0">
                    <div class="contact-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    </div>
                    <div class="contact-text">
                        <span class="contact-label">Email</span>
                        <span class="contact-value">your.email@example.com</span>
                    </div>
                </a>
                <a href="https://linkedin.com" class="contact-link reveal" data-delay="80" target="_blank" rel="noopener">
                    <div class="contact-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 2h-17A1.5 1.5 0 002 3.5v17A1.5 1.5 0 003.5 22h17a1.5 1.5 0 001.5-1.5v-17A1.5 1.5 0 0020.5 2zM8 19H5v-9h3zM6.5 8.25A1.75 1.75 0 118.3 6.5a1.78 1.78 0 01-1.8 1.75zM19 19h-3v-4.74c0-1.42-.6-1.93-1.38-1.93A1.74 1.74 0 0013 14.19a.66.66 0 000 .14V19h-3v-9h2.9v1.3a3.11 3.11 0 012.7-1.4c1.55 0 3.36.86 3.36 3.66z"/></svg>
                    </div>
                    <div class="contact-text">
                        <span class="contact-label">LinkedIn</span>
                        <span class="contact-value">/in/your-profile</span>
                    </div>
                </a>
                <a href="https://github.com" class="contact-link reveal" data-delay="160" target="_blank" rel="noopener">
                    <div class="contact-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .3a12 12 0 00-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.9 1.2 1.9 1.2 1.1 1.9 2.9 1.4 3.6 1 .1-.8.4-1.4.8-1.7-2.7-.3-5.5-1.3-5.5-6 0-1.3.5-2.4 1.2-3.2-.1-.4-.5-1.6.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 016 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.8.1 3.2.7.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.7-5.5 6 .4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0012 .3"/></svg>
                    </div>
                    <div class="contact-text">
                        <span class="contact-label">GitHub</span>
                        <span class="contact-value">@your-username</span>
                    </div>
                </a>
                <a href="../assets/files/resume.pdf" class="contact-link reveal" data-delay="240" download>
                    <div class="contact-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    </div>
                    <div class="contact-text">
                        <span class="contact-label">Resume</span>
                        <span class="contact-value">Download PDF</span>
                    </div>
                </a>
            </div>

            <p class="reveal" style="margin-top: 2.5rem; color: var(--text-muted); font-size: 0.9rem; font-family: var(--font-mono);">
                // contact form coming soon
            </p>
        </div>
    </section>

    <footer class="site-footer">
        <div class="container">&copy; 2026 Cristian Diaz</div>
    </footer>

    <script src="../assets/js/nav.js"></script>
    <script src="../assets/js/fx.js"></script>
</body>
</html>
